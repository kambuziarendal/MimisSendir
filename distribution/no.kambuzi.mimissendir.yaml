  "name": "MímisSendir",
  "summary": "Native Haiku chat with video previews and optional Signal bridging. Beta.",
  "description": "MímisSendir is a native XMPP messenger for Haiku, built by Kambuzi EDB to help make Haiku our daily driver without losing touch with our Signal conversations. Based on Renga, it also works with an ordinary XMPP account. Signal access is optional and requires a separate bridge.\n\nChat with contacts and groups, reply to or forward messages, edit your sent text, and react with emoji. Keep local conversation history and share images, GIFs, stickers and videos. Delivery and read indicators depend on support from the server, bridge and other client. GIPHY search uses your own API key, stored in Haiku KeyStore.\n\nIn beta 11, visible videos get automatic static previews without autoplay or sound. Press the play button in the image to start, and click the video to pause. The play button returns when paused, and each preview stays visible when another video plays. There is no control strip below the image. Right-click to save the file or open it in MediaPlayer. Preview downloads are limited to trusted upload hosts and 50 MiB per clip.\n\nMímisSendir can coexist with Renga and offers a non-destructive profile copy on first launch. No messaging account, hosted bridge or shared API key is included. For Signal, use your existing phone account and a self-hosted bridge on a separate Linux x86_64 server. Signal encryption terminates at the bridge.\n\nSignal bridge installation guide: https://github.com/kambuziarendal/MimisSendir/blob/bridge-v0.1.0-beta.1/docs/public/BRIDGE.md\nSignal sticker-pack installation links must be opened in WebPositive (Web+), not Firefox.\n\nEarly beta for Haiku R1 beta6 x86_64. Tested in an isolated Haiku environment with synthetic conversations and media; physical-device playback and live Signal interoperability are not verified. Source code and recovery notes are available on GitHub.\n\nBased on Renga and its original contributors. Developed by Kambuzi EDB with AI-assisted programming using OpenAI Codex through OpenClaw.",
